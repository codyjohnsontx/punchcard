name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: make test
      - run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --zip
      - run: codesign --verify --verbose dist/Punchcard.app
      - run: lipo dist/Punchcard.app/Contents/MacOS/Punchcard -verify_arch arm64 x86_64
      - run: cd dist && shasum -a 256 -c Punchcard-*-macos.zip.sha256
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/Punchcard-*-macos.zip dist/Punchcard-*-macos.zip.sha256
          --verify-tag --generate-notes --title "Punchcard $GITHUB_REF_NAME"
